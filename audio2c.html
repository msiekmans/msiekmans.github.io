<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Waveform Visualizer</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      font-family: sans-serif;
    }

    body {
      flex-direction: column;
    }

    .wrapper {
      position: relative;
      width: 100svw;
      height: 100svh;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    audio {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      opacity: 0.8;
    }

    .controls {
      position: absolute;
      top: 10px;
      right: 0px;
      background: rgba(255, 255, 255, 0.8);
      padding: 0.5em 1em;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 1em;
      z-index: 2;
    }

    .controls label {
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="controls">
      <label for="fpsSlider">FPS: <span id="fpsValue">15</span></label>
      <input type="range" id="fpsSlider" min="5" max="60" value="15" />

      <label for="scaleSlider">Amplitude: <span id="scaleValue">3</span></label>
      <input type="range" id="scaleSlider" min="1" max="5" value="3" step="0.1" />
    </div>

    <audio id="audio" controls>
      Your browser does not support the audio element.
    </audio>

    <canvas id="canvas"></canvas>
  </div>

  <script>
    const audio = document.getElementById('audio');
    audio.crossOrigin = "anonymous"; // Must come first
    audio.src = "https://star-control.com/fan/music/Mark-Vera/markvera-hyperspace_electro_blast_oc_remix.mp3";
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioContext.createAnalyser();

    analyser.fftSize = 256;
    const bufferLength = analyser.fftSize;
    const dataArray = new Uint8Array(bufferLength);

    let sourceConnected = false;
    let animationStarted = false;

    // Resize canvas to match its displayed size
    function resizeCanvasToCSS() {
      const style = getComputedStyle(canvas);
      canvas.width = parseInt(style.width, 10);
      canvas.height = parseInt(style.height, 10);
    }

    window.addEventListener('resize', resizeCanvasToCSS);
    resizeCanvasToCSS();

    // === Framerate control ===
    let fps = 15;
    let frameInterval = 1000 / fps;
    let lastFrameTime = 0;

    function setFPS(newFPS) {
      fps = newFPS;
      frameInterval = 1000 / fps;
      document.getElementById('fpsValue').textContent = fps;
    }

    document.getElementById('fpsSlider').addEventListener('input', (e) => {
      setFPS(parseInt(e.target.value));
    });

    // === Scale control ===
    let scale = 3;

    function setScale(newScale) {
      scale = newScale;
      document.getElementById('scaleValue').textContent = scale.toFixed(1);
    }

    document.getElementById('scaleSlider').addEventListener('input', (e) => {
      setScale(parseFloat(e.target.value));
    });

    function drawFrame(now) {
      requestAnimationFrame(drawFrame);

      const delta = now - lastFrameTime;
      if (delta < frameInterval) return;
      lastFrameTime = now;

      analyser.getByteTimeDomainData(dataArray);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.lineWidth = 3;
      ctx.strokeStyle = 'red';
      ctx.beginPath();

      const sliceWidth = canvas.width / (bufferLength - 1);
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = ((v - 1) * canvas.height / 2) * scale + canvas.height / 2;

        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }

        x += sliceWidth;
      }

      ctx.stroke();
    }

    audio.addEventListener('play', async () => {
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      if (!sourceConnected) {
        const source = audioContext.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        sourceConnected = true;
      }

      if (!animationStarted) {
        requestAnimationFrame(drawFrame);
        animationStarted = true;
      }
    });

    // Initialize display
    setFPS(fps);
    setScale(scale);
    requestAnimationFrame(drawFrame);
    animationStarted = true;
  </script>
</body>
</html>
